<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Aurora Bridge</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  #name { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #000; font-family: Antonio, "Arial Narrow", sans-serif; color: #ff9900; z-index: 2; }
  #name h1 { margin: 0; font-size: 40px; letter-spacing: 2px; }
  #name p { margin: 0; color: #ffcc99; font-size: 18px; }
  #name input { font: inherit; font-size: 26px; padding: 8px 18px; width: 260px; border-radius: 26px; border: 3px solid #9999ff; background: #0e101e;
    color: #fff; text-transform: uppercase; text-align: center; outline: none; }
  #name button { font: inherit; font-size: 24px; padding: 8px 40px; border-radius: 26px; border: 0; background: #ff9900; color: #000; }
</style>
<script src="vendor/qrcode.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<form id="name" autocomplete="off">
  <h1>STARSHIP AURORA</h1>
  <p>YOUR NAME ON THE BRIDGE</p>
  <input maxlength="14" placeholder="NAME" autocapitalize="characters" enterkeyhint="go">
  <button type="submit">JOIN THE CREW</button>
</form>
<script type="module" src="js/app.js"></script>
</body>
</html>
