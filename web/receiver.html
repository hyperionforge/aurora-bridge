<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora Main Viewer</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }</style>
<!-- Google Cast Web Receiver (CAF) SDK -->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
  // Chromecast custom receiver. The casting phone relays the host's
  // snapshots over a custom message channel; this page only draws them.
  import { TvApp, loadFonts, sound } from './js/tv.js';
  import { TtsPlayer } from './js/ttsplayer.js';
  const NS = 'urn:x-cast:com.aurora.bridge';
  await loadFonts();
  // TVs often crop the picture's edges: keep 4% clear all round
  const app = new TvApp(document.getElementById('cv'), { status: 'CONNECTED - WAITING FOR THE BRIDGE...', safe: 0.04 });
  try { sound.unlock(); } catch {}
  const ctx = cast.framework.CastReceiverContext.getInstance();
  const tts = new TtsPlayer(); // speech the phone renders for us, if we can't speak ourselves
  ctx.addCustomMessageListener(NS, (ev) => {
    let d = ev.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
    if (d && d.t && !tts.onMsg(d)) app.onMsg(d);
  });
  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;          // a mission can run for many minutes with no media playing
  options.maxInactivity = 3600;
  options.skipPlayersLoad = true;              // no media player needed
  options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  ctx.start(options);
  // can this Chromecast speak? tell the casting phone, which reads the hails itself if not
  const report = (ok) => { try { ctx.sendCustomMessage(NS, undefined, { t: 'voice', ok }); } catch {} };
  app.narrator.enabled = false;
  setTimeout(() => {
    const ok = app.voice.hasVoices();
    app.narrator.enabled = ok;
    if (ok) { const u = app.voice.say(' ', { lang: 'en-US', pitch: 1, rate: 1 }, 1, () => { app.narrator.enabled = false; report(false); }); }
    report(ok);
  }, 4000);
  ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => setTimeout(() => report(app.narrator.enabled), 1500));
</script>
</body>
</html>
