# Builds the Android app (APK to download) and publishes web/ to GitHub Pages
# (the Chromecast receiver page must be on HTTPS - Pages does that for free).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK as a release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # the GitHub runner already has the Android SDK installed (ANDROID_HOME)
      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-bridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # newest APK always at https://github.com/<you>/<repo>/releases/latest/download/AuroraBridge.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuroraBridge.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AuroraBridge.apk --title "Aurora Bridge (latest build)" --latest \
            --notes "Newest build of the app. Open this page on your phone, tap AuroraBridge.apk to download, then open it to install. Built from ${GITHUB_SHA::7}."

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
